# emergency-service — standalone compose (polyrepo style).
# Requires shared EXTERNAL infra (postgres on the dpdp-network) AND auth/audit
# reachable on that network — see ../DOCKER.md.
# Run from this directory:  docker compose up -d --build
# Build context is the repo root (..) because go.mod uses `replace ../shared`.
services:
  emergency-service:
    container_name: dpdp-emergency
    build:
      context: ..
      dockerfile: emergency-service/Dockerfile
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      EMERGENCY_SERVICE_PORT: "9005"
      DATABASE_URL: "postgres://dpdp_app:dpdp_app_local_dev_pw@postgres:5432/dpdp?sslmode=disable"
      JWT_PUBLIC_KEY_PATH: /keys/auth_public.pem
      AUTH_SERVICE_URL: "http://auth-service:9006"
      AUDIT_SERVICE_URL: "http://audit-service:9001"
      SERVICE_TOKEN_SECRET: ${SERVICE_TOKEN_SECRET:-LOCAL-INTERNAL-SERVICE-SECRET-DEV-ONLY}
      AWS_SECRETS_MOCK: "true"
      LOCAL_SECRETS_PATH: /secrets/local_hospital_keys.json
    ports:
      - "9005:9005"
    volumes:
      - ../auth-service/keys:/keys:ro
      - ../DPDP/secrets:/secrets:ro
      - /data/logs:/data/logs
    restart: unless-stopped
    networks:
      - dpdp-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9005/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  dpdp-network:
    external: true
