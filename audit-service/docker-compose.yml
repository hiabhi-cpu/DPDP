# audit-service — standalone compose (polyrepo style).
# Requires shared EXTERNAL infra (postgres on the dpdp-network) — see ../DOCKER.md.
# Run from this directory:  docker compose up -d --build
# Build context is the repo root (..) because go.mod uses `replace ../shared`.
# The JWT public key lives in auth-service/keys (mounted read-only).
services:
  audit-service:
    container_name: dpdp-audit
    build:
      context: ..
      dockerfile: audit-service/Dockerfile
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      AUDIT_SERVICE_PORT: "9001"
      DATABASE_URL: "postgres://dpdp_app:dpdp_app_local_dev_pw@postgres:5432/dpdp?sslmode=disable"
      JWT_PUBLIC_KEY_PATH: /keys/auth_public.pem
    ports:
      - "9001:9001"
    volumes:
      - ../auth-service/keys:/keys:ro
      - /data/logs:/data/logs
    restart: unless-stopped
    networks:
      - dpdp-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  dpdp-network:
    external: true
